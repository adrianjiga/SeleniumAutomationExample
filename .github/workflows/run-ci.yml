name: Run CI

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run CI against"
        required: false
        default: "master"
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Filter Paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            api:
              - 'src/test/java/com/example/tests/api/**'
              - 'testng-api.xml'
            ui:
              - 'src/test/java/com/example/tests/ui/**'
              - 'testng-ui.xml'
            shared:
              - 'pom.xml'
              - 'testng.xml'
              - '.github/workflows/**'

  validate:
    name: Validate Build Environment
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Cache Maven Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup Chrome
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.shared == 'true'
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd #v2.1.2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Verify Java
        run: |
          echo "Java version:"
          java -version
          echo ""
          echo "Maven version:"
          mvn -version

      - name: Verify Chrome
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          echo "Chrome version:"
          google-chrome --version

      - name: Validate Dependencies
        run: mvn dependency:resolve -B -q

      - name: Compile Project
        run: mvn clean compile test-compile -B -q

      - name: Cache Compiled Classes
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/classes
            target/test-classes
          key: ${{ runner.os }}-compiled-${{ github.sha }}

      - name: Validate TestNG Suites
        run: |
          sudo apt-get install -y libxml2-utils > /dev/null 2>&1
          echo "Checking TestNG configuration files..."
          failed=0
          for file in testng.xml testng-api.xml testng-ui.xml; do
            if [[ -f "$file" ]]; then
              echo "[OK] $file exists"
              # Validate XML syntax (--nonet skips external DTD fetch)
              if xmllint --noout --nonet "$file" 2>/dev/null; then
                echo "  [OK] Valid XML syntax"
              else
                echo "  [FAIL] Invalid XML syntax"
                xmllint --noout --nonet "$file" 2>&1 || true
                failed=1
              fi
            else
              echo "[FAIL] $file missing"
              failed=1
            fi
          done
          exit $failed

      - name: Summary
        run: |
          echo "### CI Validation Summary :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Java Setup | OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Maven Dependencies | OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Compilation | OK |" >> $GITHUB_STEP_SUMMARY
          echo "| TestNG Suites | OK |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Changes detected:**" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${{ needs.changes.outputs.api }}" >> $GITHUB_STEP_SUMMARY
          echo "- UI: ${{ needs.changes.outputs.ui }}" >> $GITHUB_STEP_SUMMARY
          echo "- Shared: ${{ needs.changes.outputs.shared }}" >> $GITHUB_STEP_SUMMARY
