name: Run CI

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Filter Paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            api:
              - 'src/test/java/com/example/tests/api/**'
              - 'testng-api.xml'
            ui:
              - 'src/test/java/com/example/tests/ui/**'
              - 'testng-ui.xml'
            shared:
              - 'pom.xml'
              - 'testng.xml'
              - '.github/workflows/**'

  validate:
    name: Validate Build Environment
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Cache Maven Dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup Chrome
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.shared == 'true'
        uses: browser-actions/setup-chrome@b94431e051d1c52dcbe9a7092a4f10f827795416 #v2.1.0
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Verify Java
        run: |
          echo "Java version:"
          java -version
          echo ""
          echo "Maven version:"
          mvn -version

      - name: Verify Chrome
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          echo "Chrome version:"
          google-chrome --version

      - name: Validate Dependencies
        run: mvn dependency:resolve -B -q

      - name: Compile Project
        run: mvn clean compile test-compile -B -q

      - name: Cache Compiled Classes
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            target/classes
            target/test-classes
          key: ${{ runner.os }}-compiled-${{ github.sha }}

      - name: Validate TestNG Suites
        run: |
          echo "Checking TestNG configuration files..."
          failed=0
          for file in testng.xml testng-api.xml testng-ui.xml; do
            if [[ -f "$file" ]]; then
              echo "✓ $file exists"
              # Validate XML syntax (--nonet skips external DTD fetch)
              if xmllint --noout --nonet "$file" 2>/dev/null; then
                echo "  ✓ Valid XML syntax"
              else
                echo "  ✗ Invalid XML syntax"
                failed=1
              fi
            else
              echo "✗ $file missing"
              failed=1
            fi
          done
          exit $failed

      - name: Summary
        run: |
          echo "### CI Validation Summary :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Java Setup | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| Maven Dependencies | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| Compilation | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| TestNG Suites | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Changes detected:**" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${{ needs.changes.outputs.api }}" >> $GITHUB_STEP_SUMMARY
          echo "- UI: ${{ needs.changes.outputs.ui }}" >> $GITHUB_STEP_SUMMARY
          echo "- Shared: ${{ needs.changes.outputs.shared }}" >> $GITHUB_STEP_SUMMARY