name: Run Tests

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 7 * * 1-5" # Every Monday to Friday at 07:00 UTC
  workflow_dispatch:
    inputs:
      test_group:
        description: 'Test group to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - api
          - ui

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # Always run on schedule/dispatch, detect changes on PR
    if: github.event_name != 'pull_request' || github.event_name == 'pull_request'
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
      should_run_api: ${{ steps.decide.outputs.api }}
      should_run_ui: ${{ steps.decide.outputs.ui }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Filter Paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            api:
              - 'src/test/java/com/example/tests/api/**'
              - 'testng-api.xml'
              - 'pom.xml'
            ui:
              - 'src/test/java/com/example/tests/ui/**'
              - 'testng-ui.xml'
              - 'pom.xml'

      - name: Decide What to Run
        id: decide
        run: |
          # For scheduled runs or workflow_dispatch, run based on input or all
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "api=true" >> $GITHUB_OUTPUT
            echo "ui=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.test_group }}" in
              api)
                echo "api=true" >> $GITHUB_OUTPUT
                echo "ui=false" >> $GITHUB_OUTPUT
                ;;
              ui)
                echo "api=false" >> $GITHUB_OUTPUT
                echo "ui=true" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "api=true" >> $GITHUB_OUTPUT
                echo "ui=true" >> $GITHUB_OUTPUT
                ;;
            esac
          else
            # For PRs, use path filter results (default to true if no filter ran)
            echo "api=${{ steps.filter.outputs.api || 'true' }}" >> $GITHUB_OUTPUT
            echo "ui=${{ steps.filter.outputs.ui || 'true' }}" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build & Cache
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.should_run_api == 'true' || needs.changes.outputs.should_run_ui == 'true'
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Cache Maven Dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Generate Cache Key
        id: cache-key
        run: echo "key=${{ runner.os }}-compiled-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Check Compiled Cache
        id: compiled-cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            target/classes
            target/test-classes
            target/generated-test-sources
          key: ${{ steps.cache-key.outputs.key }}

      - name: Compile Project
        if: steps.compiled-cache.outputs.cache-hit != 'true'
        run: mvn clean compile test-compile -B -q

      - name: Save Compiled Cache
        if: steps.compiled-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            target/classes
            target/test-classes
            target/generated-test-sources
          key: ${{ steps.cache-key.outputs.key }}

  test-api:
    name: API Tests
    needs: [changes, build]
    if: needs.changes.outputs.should_run_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Restore Maven Dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Restore Compiled Classes
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            target/classes
            target/test-classes
            target/generated-test-sources
          key: ${{ needs.build.outputs.cache-key }}

      - name: Run API Tests
        id: tests
        run: mvn test -DsuiteXmlFile=testng-api.xml -B
        continue-on-error: true

      - name: Generate Test Summary
        if: always()
        uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86 # v2.4
        with:
          paths: target/surefire-reports/TEST-*.xml
          show: all

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-reports-api
          path: |
            target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Test Logs on Failure
        if: failure() || steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-logs-api
          path: |
            target/surefire-reports/*.xml
            target/surefire-reports/*.txt
          retention-days: 14

      - name: Fail if Tests Failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  test-ui:
    name: UI Tests
    needs: [changes, build]
    if: needs.changes.outputs.should_run_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Restore Maven Dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Restore Compiled Classes
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            target/classes
            target/test-classes
            target/generated-test-sources
          key: ${{ needs.build.outputs.cache-key }}

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@b94431e051d1c52dcbe9a7092a4f10f827795416 #v2.1.0
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Cache WebDriverManager
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.cache/selenium
          key: ${{ runner.os }}-webdriver-chrome-stable
          restore-keys: |
            ${{ runner.os }}-webdriver-

      - name: Verify Chrome Installation
        run: |
          echo "Chrome version:"
          google-chrome --version
          echo "ChromeDriver will be managed by WebDriverManager"

      - name: Run UI Tests
        id: tests
        run: mvn test -DsuiteXmlFile=testng-ui.xml -B
        continue-on-error: true

      - name: Generate Test Summary
        if: always()
        uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86 # v2.4
        with:
          paths: target/surefire-reports/TEST-*.xml
          show: all

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-reports-ui
          path: |
            target/surefire-reports/
            target/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Test Logs on Failure
        if: failure() || steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-logs-ui
          path: |
            target/surefire-reports/*.xml
            target/surefire-reports/*.txt
            target/screenshots/
          retention-days: 14

      - name: Fail if Tests Failed
        if: steps.tests.outcome == 'failure'
        run: exit 1