name: Run Tests

on:
  #  pull_request:
  #    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test - ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [api, ui]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup Chrome
        if: matrix.group == 'ui'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Chrome Installation
        if: matrix.group == 'ui'
        run: |
          echo "Chrome version:"
          google-chrome --version
          echo "ChromeDriver will be managed by WebDriverManager"

      - name: Install Chrome Dependencies
        if: matrix.group == 'ui'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64

      - name: Install Dependencies
        run: mvn clean install -DskipTests

      - name: Run ${{ matrix.group }} Tests
        run: mvn test -DsuiteXmlFile=testng-${{ matrix.group }}.xml

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.group }}
          path: |
            target/surefire-reports/
            target/screenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.group }}
          path: |
            target/surefire-reports/*.xml
            target/surefire-reports/*.txt
          retention-days: 30