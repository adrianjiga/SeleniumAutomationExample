name: Run Tests

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 7 * * 1-5" # Every Monday to Friday at 07:00 UTC
  workflow_dispatch:
    inputs:
      test_group:
        description: 'Test group to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - api
          - ui

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # Always run on schedule/dispatch, detect changes on PR
    if: github.event_name != 'pull_request' || github.event_name == 'pull_request'
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
      should_run_api: ${{ steps.decide.outputs.api }}
      should_run_ui: ${{ steps.decide.outputs.ui }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter Paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'src/test/java/com/example/tests/api/**'
              - 'testngApi.xml'
              - 'pom.xml'
              # A change to this workflow must run the tests it orchestrates, or a broken job
              # graph only surfaces after merge, on the scheduled run.
              - '.github/workflows/runTests.yml'
            ui:
              - 'src/test/java/com/example/tests/ui/**'
              - 'src/test/java/com/example/accessibility/**'
              - 'testngUi.xml'
              - 'pom.xml'
              - '.github/workflows/runTests.yml'

      - name: Decide What to Run
        id: decide
        run: |
          # For scheduled runs or workflow_dispatch, run based on input or all
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "api=true" >> $GITHUB_OUTPUT
            echo "ui=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.test_group }}" in
              api)
                echo "api=true" >> $GITHUB_OUTPUT
                echo "ui=false" >> $GITHUB_OUTPUT
                ;;
              ui)
                echo "api=false" >> $GITHUB_OUTPUT
                echo "ui=true" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "api=true" >> $GITHUB_OUTPUT
                echo "ui=true" >> $GITHUB_OUTPUT
                ;;
            esac
          else
            # For PRs, use path filter results (default to true if no filter ran)
            echo "api=${{ steps.filter.outputs.api || 'true' }}" >> $GITHUB_OUTPUT
            echo "ui=${{ steps.filter.outputs.ui || 'true' }}" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build & Cache
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.should_run_api == 'true' || needs.changes.outputs.should_run_ui == 'true'
    outputs:
      cacheKey: ${{ steps.cacheKey.outputs.key }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Cache Maven Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Generate Cache Key
        id: cacheKey
        run: echo "key=${{ runner.os }}-compiled-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Check Compiled Cache
        id: compiledCache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/classes
            target/test-classes
            target/generated-test-sources
          key: ${{ steps.cacheKey.outputs.key }}

      - name: Compile Project
        if: steps.compiledCache.outputs.cache-hit != 'true'
        run: mvn clean compile test-compile -B -q

      - name: Save Compiled Cache
        if: steps.compiledCache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/classes
            target/test-classes
            target/generated-test-sources
          key: ${{ steps.cacheKey.outputs.key }}

  testApi:
    name: API Tests
    needs: [changes, build]
    if: needs.changes.outputs.should_run_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Restore Maven Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Restore Compiled Classes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/classes
            target/test-classes
            target/generated-test-sources
          key: ${{ needs.build.outputs.cacheKey }}

      - name: Run API Tests
        id: tests
        run: mvn test -DsuiteXmlFile=testngApi.xml -B
        continue-on-error: true

      - name: Generate Test Summary
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: target/surefire-reports/TEST-*.xml
          show: all

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testReportsApi
          path: |
            target/surefire-reports/
            target/allure-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Test Logs on Failure
        if: failure() || steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testLogsApi
          path: |
            target/surefire-reports/*.xml
            target/surefire-reports/*.txt
          retention-days: 30

      - name: Fail if Tests Failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  testUi:
    name: UI Tests
    needs: [changes, build]
    if: needs.changes.outputs.should_run_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Restore Maven Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Restore Compiled Classes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/classes
            target/test-classes
            target/generated-test-sources
          key: ${{ needs.build.outputs.cacheKey }}

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 #v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Cache WebDriverManager
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/selenium
          key: ${{ runner.os }}-webdriver-chrome-stable
          restore-keys: |
            ${{ runner.os }}-webdriver-

      - name: Verify Chrome Installation
        run: |
          echo "Chrome version:"
          google-chrome --version
          echo "ChromeDriver will be managed by WebDriverManager"

      - name: Run UI Tests
        id: tests
        run: mvn test -DsuiteXmlFile=testngUi.xml -B
        continue-on-error: true

      - name: Generate Test Summary
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: target/surefire-reports/TEST-*.xml
          show: all

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testReportsUi
          path: |
            target/surefire-reports/
            target/allure-results/
            target/screenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Test Logs on Failure
        if: failure() || steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testLogsUi
          path: |
            target/surefire-reports/*.xml
            target/surefire-reports/*.txt
            target/screenshots/
          retention-days: 30

      - name: Fail if Tests Failed
        if: steps.tests.outcome == 'failure'
        run: exit 1